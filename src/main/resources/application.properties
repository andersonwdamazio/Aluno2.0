spring.application.name=MinhaAPI

# Ajuste DB_USERNAME e DB_PASSWORD para as credenciais do seu PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alunosdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}DB_PASSWORD

# Cria/atualiza a tabela a partir da entidade JPA sem apagar os dados existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
